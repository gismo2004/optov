name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    name: Tests and checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      # serialx is what the transport speaks to; it comes with Home Assistant at runtime.
      - run: pip install pytest pyflakes ruff serialx
      - run: python -m pyflakes custom_components/optov/*.py tests/*.py
      # The rules are in ruff.toml; this is a check, not a reformat.
      - run: ruff check custom_components/optov tests
      - run: python -m pytest -q tests
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      # The card fails in a browser with "Configuration error" and nothing in any log, so it
      # is rendered here against a stub DOM instead.
      - run: node tests/card_smoke.js

  hassfest:
    name: Home Assistant manifest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The tool itself rather than the action, which runs every check: the translations carry
      # the `card` and `text` sections the dashboard card fetches through Home Assistant's own
      # translation API, and hassfest's schema knows neither.
      - run: |
          docker run --rm -v "${{ github.workspace }}:/github/workspace" \
            ghcr.io/home-assistant/hassfest --skip-plugins translations

  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hacs/action@main
        with:
          category: integration
